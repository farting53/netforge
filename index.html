<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetForge | Network & Floorplan Designer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Konva.js -->
    <script src="https://unpkg.com/konva@9.3.6/konva.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-200 h-screen flex flex-col overflow-hidden">

    <!-- Top Navbar -->
    <header class="h-14 border-b border-slate-800 bg-slate-900/50 backdrop-blur-md flex items-center justify-between px-4 shrink-0 z-50">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-cyan-500 rounded flex items-center justify-center shadow-[0_0_15px_rgba(6,182,212,0.5)]">
                    <i data-lucide="network" class="text-slate-950 w-5 h-5"></i>
                </div>
                <h1 class="font-bold text-xl tracking-tight text-white">Net<span class="text-cyan-400">Forge</span></h1>
            </div>

            <div class="h-6 w-px bg-slate-800 mx-2"></div>

            <div class="flex items-center gap-1 bg-slate-800/50 p-1 rounded-lg border border-slate-700">
                <button id="tool-select" class="toolbar-btn active" title="Select (V)">
                    <i data-lucide="mouse-pointer-2" class="w-4 h-4"></i>
                </button>
                <button id="tool-connect" class="toolbar-btn" title="Connect (C)">
                    <i data-lucide="link-2" class="w-4 h-4"></i>
                </button>
                <button id="tool-wall" class="toolbar-btn" title="Wall Tool (W)">
                    <i data-lucide="pen-tool" class="w-4 h-4"></i>
                </button>
                <button id="tool-room" class="toolbar-btn" title="Room Tool (R)">
                    <i data-lucide="square" class="w-4 h-4"></i>
                </button>
                <button id="tool-door" class="toolbar-btn" title="Door Tool (D)">
                    <i data-lucide="door-open" class="w-4 h-4"></i>
                </button>
            </div>

            <button id="snap-toggle" class="flex items-center gap-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-md border border-slate-700 transition-colors" title="Toggle Grid Snap">
                <i data-lucide="grid" class="w-4 h-4 text-cyan-400"></i>
                <span class="text-xs font-medium">Snap</span>
                <div id="snap-indicator" class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.8)]"></div>
            </button>
        </div>

        <div class="flex items-center gap-3">
            <div class="relative group">
                <button class="flex items-center gap-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-md border border-slate-700 transition-colors">
                    <i data-lucide="layout-template" class="w-4 h-4"></i>
                    <span class="text-xs font-medium">Templates</span>
                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div class="absolute right-0 top-full mt-1 w-64 bg-slate-900 border border-slate-700 rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-[60] p-2">
                    <div class="text-[10px] uppercase tracking-wider text-slate-500 font-bold mb-2 px-2">Floorplan Layouts</div>
                    <button class="template-item" data-template="home">Home Office</button>
                    <button class="template-item" data-template="small-office">Small Office</button>
                    <button class="template-item" data-template="school">School Campus</button>
                    <button class="template-item" data-template="enterprise">Enterprise Floor</button>
                    <div class="border-t border-slate-800 my-2"></div>
                    <div class="text-[10px] uppercase tracking-wider text-slate-500 font-bold mb-2 px-2">Network Topologies</div>
                    <button class="template-item" data-template="basic-home">Basic Home Network</button>
                    <button class="template-item" data-template="office-lan">Office LAN</button>
                    <button class="template-item" data-template="campus-net">Campus Network</button>
                    <button class="template-item" data-template="data-center">Data Center</button>
                </div>
            </div>

            <div class="h-6 w-px bg-slate-800"></div>

            <button id="btn-export" class="flex items-center gap-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-md border border-slate-700 transition-colors" title="Export as PNG">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span class="text-xs font-medium">Export</span>
            </button>

            <div class="flex items-center gap-1 bg-slate-800/50 p-1 rounded-lg border border-slate-700">
                <button id="btn-save" class="p-1.5 hover:bg-slate-700 rounded transition-colors" title="Save JSON">
                    <i data-lucide="save" class="w-4 h-4"></i>
                </button>
                <button id="btn-load" class="p-1.5 hover:bg-slate-700 rounded transition-colors" title="Load JSON">
                    <i data-lucide="upload" class="w-4 h-4"></i>
                </button>
                <button id="btn-clear" class="p-1.5 hover:bg-red-900/30 text-red-400 hover:text-red-300 rounded transition-colors" title="Clear Canvas">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- Left Sidebar: Library -->
        <aside id="left-sidebar" class="w-72 border-r border-slate-800 bg-slate-900/30 backdrop-blur-sm flex flex-col transition-all duration-300 overflow-hidden">
            <div class="p-4 border-b border-slate-800">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                    <input type="text" id="library-search" placeholder="Search components..." class="w-full bg-slate-950 border border-slate-700 rounded-md py-2 pl-9 pr-4 text-sm focus:outline-none focus:ring-1 focus:ring-cyan-500 transition-all">
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-2 space-y-2 custom-scrollbar" id="library-content">
                <!-- Categories will be injected by JS -->
            </div>

            <button id="toggle-left-sidebar" class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 w-5 h-10 bg-slate-800 border border-slate-700 rounded-full flex items-center justify-center hover:bg-slate-700 z-50">
                <i data-lucide="chevron-left" class="w-3 h-3"></i>
            </button>
        </aside>

        <!-- Main Canvas Area -->
        <main class="flex-1 relative overflow-hidden bg-slate-950">
            <div id="canvas-container" class="w-full h-full outline-none"></div>

            <!-- Canvas HUD -->
            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-4 px-4 py-2 bg-slate-900/80 backdrop-blur-md border border-slate-700 rounded-full shadow-2xl z-40">
                <button id="zoom-out" class="p-1 hover:text-cyan-400 transition-colors"><i data-lucide="minus" class="w-4 h-4"></i></button>
                <span id="zoom-level" class="text-xs font-mono min-w-[3rem] text-center">100%</span>
                <button id="zoom-in" class="p-1 hover:text-cyan-400 transition-colors"><i data-lucide="plus" class="w-4 h-4"></i></button>
                <div class="w-px h-4 bg-slate-700 mx-1"></div>
                <button id="center-view" class="p-1 hover:text-cyan-400 transition-colors" title="Center View"><i data-lucide="maximize" class="w-4 h-4"></i></button>
                <div class="w-px h-4 bg-slate-700 mx-1"></div>
                <div class="flex items-center gap-2">
                    <button id="undo-btn" class="p-1 hover:text-cyan-400 disabled:opacity-30 disabled:hover:text-inherit transition-colors" title="Undo (Ctrl+Z)"><i data-lucide="undo-2" class="w-4 h-4"></i></button>
                    <button id="redo-btn" class="p-1 hover:text-cyan-400 disabled:opacity-30 disabled:hover:text-inherit transition-colors" title="Redo (Ctrl+Y)"><i data-lucide="redo-2" class="w-4 h-4"></i></button>
                </div>
            </div>

            <!-- Wall/Tool Tooltip -->
            <div id="tool-hint" class="absolute top-4 left-1/2 -translate-x-1/2 px-3 py-1.5 bg-cyan-500 text-slate-950 text-xs font-bold rounded shadow-lg pointer-events-none opacity-0 transition-opacity">
                Click to place wall point. Right-click to cancel.
            </div>
        </main>

        <!-- Right Sidebar: Properties -->
        <aside id="right-sidebar" class="w-72 border-l border-slate-800 bg-slate-900/30 backdrop-blur-sm flex flex-col transition-all duration-300">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                <h2 class="font-bold text-sm uppercase tracking-wider text-slate-400">Properties</h2>
                <i data-lucide="settings" class="w-4 h-4 text-slate-500"></i>
            </div>

            <div id="properties-content" class="flex-1 overflow-y-auto p-4 custom-scrollbar">
                <div class="h-full flex flex-col items-center justify-center text-slate-600 space-y-3">
                    <i data-lucide="mouse-pointer-2" class="w-8 h-8 opacity-20"></i>
                    <p class="text-xs text-center px-6">Select an item on the canvas to view and edit its properties.</p>
                </div>
            </div>

            <button id="toggle-right-sidebar" class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1/2 w-5 h-10 bg-slate-800 border border-slate-700 rounded-full flex items-center justify-center hover:bg-slate-700 z-50">
                <i data-lucide="chevron-right" class="w-3 h-3"></i>
            </button>
        </aside>
    </div>

    <!-- Status Bar -->
    <footer class="h-8 border-t border-slate-800 bg-slate-900 flex items-center justify-between px-4 shrink-0 z-50 text-[10px] uppercase tracking-widest font-bold text-slate-500">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_5px_rgba(34,197,94,0.5)]"></span>
                <span>System Ready</span>
            </div>
            <div class="flex items-center gap-3 ml-4 border-l border-slate-800 pl-4">
                <span>Nodes: <span id="stat-nodes" class="text-slate-300">0</span></span>
                <span>Links: <span id="stat-links" class="text-slate-300">0</span></span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <span id="coord-display">X: 0 Y: 0</span>
            <span class="text-cyan-500/50">NetForge v1.0</span>
        </div>
    </footer>

    <!-- Hidden file input for loading JSON -->
    <input type="file" id="json-input" accept=".json" class="hidden">

    <!-- Context Menu -->
    <div id="context-menu" class="fixed hidden bg-slate-900 border border-slate-700 rounded shadow-xl z-[100] py-1 min-w-[120px]">
        <button id="cm-delete" class="w-full text-left px-3 py-1.5 text-xs text-red-400 hover:bg-red-950/30 flex items-center gap-2">
            <i data-lucide="trash-2" class="w-3 h-3"></i>
            Delete
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
